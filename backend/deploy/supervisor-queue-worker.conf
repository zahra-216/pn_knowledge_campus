; Milestone 25 (Performance Optimization) — Production Readiness.
;
; QUEUE_CONNECTION=database (see .env.example) means queued jobs
; (every Notification since Milestone 23 — application/inquiry emails,
; in-app notifications) sit in the `jobs` table until a `queue:work`
; process picks them up. In local development that process is started
; manually (`php artisan queue:work`); in production it must run as a
; supervised, auto-restarting background service, or every queued
; notification silently piles up undelivered.
;
; Install: copy to /etc/supervisor/conf.d/pnkc-queue-worker.conf on the
; app server, edit the two /path/to/... placeholders, then:
;   supervisorctl reread && supervisorctl update && supervisorctl start pnkc-queue-worker:*

[program:pnkc-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /path/to/backend/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
directory=/path/to/backend
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/path/to/backend/storage/logs/queue-worker.log
stopwaitsecs=3600
